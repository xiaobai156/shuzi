name: Inspect root identity API

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Capture data responses carrying target identities
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          root='https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'
          needles=['寿比南山','弦无虚发','博彩兵书']
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              hits=[]
              def on_response(resp):
                  try:
                      ct=(resp.headers.get('content-type') or '').lower()
                      if 'json' not in ct and '/api/' not in resp.url:
                          return
                      text=resp.text()
                      if len(text)>8_000_000:
                          text=text[:8_000_000]
                      matched=[n for n in needles if n in text]
                      if matched:
                          hits.append((resp.status,resp.url,ct,matched,text))
                  except Exception:
                      pass
              page.on('response',on_response)
              page.goto(root,wait_until='domcontentloaded',timeout=15000)
              try: page.wait_for_load_state('networkidle',timeout=8000)
              except Exception: pass
              page.wait_for_timeout(1500)
              print('HIT_COUNT',len(hits))
              for status,url,ct,matched,text in hits:
                  print('\nRESPONSE',status,url,ct,'MATCHED',matched,'LEN',len(text))
                  for name in matched:
                      idx=text.find(name)
                      print('SNIP',name,repr(text[max(0,idx-1200):idx+2500]))
              b.close()
          PY

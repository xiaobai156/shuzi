name: Verify rolling manager articles

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 252 from authoritative landing objects
        shell: bash
        run: |
          python - <<'PY'
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          from kill_numbers.acquisition.strategies.admin_article import find_admin_article_in_landing_data, admin_article_dict_to_content, validate_identity_article_api_data
          from kill_numbers.parsing.registry import parse_target_content, available_issues_from_content

          landing_url='https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/api/proxy/landing-page-data?url=csy'
          ids={
              '寿比南山':'6a96d6011d10beea56c80e16',
              '弦无虚发':'6a96d6a51d10beea56c80e86',
          }
          targets={t['name']:t for t in crawler.load_targets()}
          for name,article_id in ids.items():
              t=dict(targets[name])
              t.update({
                  'special_parser':'identity_article_bottom_10',
                  'article_identity':name,
                  'anchor':name,
                  'region':'bottom',
                  'count':10,
              })
              with target_policy(t,['252']):
                  landing=crawler.fetch_json(landing_url)
              article=find_admin_article_in_landing_data(landing,article_id)
              if article is None:
                  raise SystemExit(f'{name}: authoritative object missing')
              validate_identity_article_api_data(article,t)
              article_name,content=admin_article_dict_to_content(article,f'https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/article/manager/{article_id}?url=csy')
              print('\n===',name,'===')
              print('AUTHOR',article_name,'ID',article_id)
              print('AVAILABLE_TAIL',available_issues_from_content(content,t)[-12:])
              found=parse_target_content(content,t,['252'])
              print('FOUND',found)
              if '252' not in found or len(found['252'])!=10 or len(set(found['252']))!=10:
                  raise SystemExit(f'{name}: invalid 252')
          PY

name: Diagnose remaining21 browser migrations

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Inspect browser-rendered same-site indexes
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from urllib.parse import urlparse, parse_qs, urljoin
          from playwright.sync_api import sync_playwright
          import crawler
          from kill_numbers.text_utils import normalize_keyword, origin

          targets={t['name']:t for t in crawler.load_targets()}
          sources={}
          dynamic=['至富财运','冰雨蝴蝶','福星金牌','金宝神皇','港澳爆庄','好料见证','你来关注']
          for name in dynamic:
              t=targets[name]
              parsed=urlparse(t['url'])
              site=(parse_qs(parsed.query).get('url') or [''])[0]
              sources[name]=[f'{origin(t["url"])}/?url={site}', origin(t['url'])+'/']
          sources.update({
              '博彩兵书':['https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'],
              '寿比南山':['https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'],
              '弦无虚发':['https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'],
              '迎着尾王':['https://8818.www73261a.com/'],
              '过眼云烟':['https://hl.90216a.com/'],
              '春蚓秋蛇':['https://1214.775486.xyz/bbs/'],
              '实至名归':['https://5ipaulfv56.1081085bbs1.shop/bbs/'],
          })
          overrides={
              '迎着尾王':['赢者为王','迎着尾王'],
              '过眼云烟':['过往云烟','过眼云烟'],
          }

          def has252(text):
              return bool(re.search(r'(?<!\d)0?252\s*期(?!\d)',text or ''))

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              context=browser.new_context(ignore_https_errors=False)
              page=context.new_page()
              page.set_default_timeout(10000)
              for name,urls in sources.items():
                  t=targets[name]
                  keys=overrides.get(name,[name])[:]
                  for value in [t.get('article_identity'),t.get('anchor')]:
                      if value:
                          keys.append(str(value))
                  normalized=[normalize_keyword(k) for k in keys if k]
                  print(f'\n=== BROWSER {name} ===')
                  for url in dict.fromkeys(urls):
                      try:
                          response=page.goto(url,wait_until='domcontentloaded',timeout=15000)
                          try:
                              page.wait_for_load_state('networkidle',timeout=7000)
                          except Exception:
                              pass
                          body=page.locator('body').inner_text(timeout=5000)
                          final=page.url
                          title=page.title()
                          print('PAGE',url,'STATUS',None if response is None else response.status,'FINAL',final,'TITLE',repr(title),'LEN',len(body),'HAS252',has252(body))
                          norm=normalize_keyword(body)
                          for key in normalized:
                              if key and key in norm:
                                  print('BODY_HIT','KEY',key,'HAS252',has252(body))
                                  break
                          links=page.locator('a').evaluate_all("els => els.map(a => [a.href, (a.innerText || a.textContent || '').trim()])")
                          hits=[]
                          for href,label in links:
                              nlabel=normalize_keyword(label)
                              if any(key and key in nlabel for key in normalized):
                                  hits.append((href,' '.join(label.split()),has252(label)))
                          print('LINK_HITS',len(hits))
                          for hit in hits[:30]:
                              print('LINK',repr(hit))
                          # Also report links explicitly carrying 252 when identity may be in a parent card.
                          issue_links=[(href,' '.join(label.split())) for href,label in links if has252(label)]
                          print('ISSUE252_LINKS',len(issue_links))
                          for item in issue_links[:20]:
                              print('252LINK',repr(item))
                      except Exception as exc:
                          print('PAGE_ERROR',url,type(exc).__name__,exc)
              context.close(); browser.close()
          PY

name: Inspect root identity DOM

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Print clickable identity DOM
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          root='https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              page.goto(root,wait_until='domcontentloaded',timeout=15000)
              try: page.wait_for_load_state('networkidle',timeout=7000)
              except Exception: pass
              for name in ['寿比南山','弦无虚发']:
                  print(f'\n=== {name} ===')
                  loc=page.get_by_text(name, exact=False)
                  print('COUNT',loc.count())
                  for i in range(min(loc.count(),5)):
                      el=loc.nth(i)
                      try:
                          print('TEXT',repr(el.inner_text()))
                          print('OUTER',el.evaluate('(e)=>e.outerHTML'))
                          print('ANCESTORS',el.evaluate("(e)=>{let a=[];for(let n=e;n&&a.length<6;n=n.parentElement)a.push(n.outerHTML.slice(0,3000));return a}"))
                      except Exception as exc:
                          print('EL_ERROR',type(exc).__name__,exc)
              b.close()
          PY

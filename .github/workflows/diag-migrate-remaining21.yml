name: Verify browser-root migrations

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Verify candidate roots through production crawler
        shell: bash
        run: |
          python - <<'PY'
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          targets={t['name']:t for t in crawler.load_targets()}
          root='https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'
          candidates=['寿比南山','弦无虚发','博彩兵书']
          for name in candidates:
              t=dict(targets[name])
              t['url']=root
              t['browser']=True
              print(f'\n=== {name} ===')
              try:
                  with target_policy(t,['252']):
                      fetched_name,docs=crawler.fetch_target_documents(t,['252'])
                  print('FETCH_NAME',fetched_name)
                  print('PARSEABLE',[(d.kind,d.url,d.priority,d.metadata) for d in docs if d.metadata.get('parseable')])
                  found,selected=crawler.parse_target_documents(docs,t,['252'])
                  print('FOUND',found)
                  print('SELECTED',None if selected is None else (selected.kind,selected.url,selected.priority,selected.metadata))
              except Exception as exc:
                  print('ERROR',type(exc).__name__,exc)
          PY

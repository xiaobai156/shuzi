name: Inspect root identity snippets

on:
  push:
    branches:
      - diag/migrate-remaining21-20260910

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium
      - name: Print exact identity neighborhoods
        shell: bash
        run: |
          python - <<'PY'
          import re
          from playwright.sync_api import sync_playwright
          root='https://szfzml.mfuw8-bnsfa-gdaxhk.xyz/'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page()
              page.goto(root,wait_until='domcontentloaded',timeout=15000)
              try: page.wait_for_load_state('networkidle',timeout=7000)
              except Exception: pass
              body=page.locator('body').inner_text()
              lines=[line.strip() for line in body.splitlines() if line.strip()]
              print('LINES',len(lines),'BODY_LEN',len(body))
              for name in ['寿比南山','弦无虚发','博彩兵书']:
                  print(f'\n=== {name} ===')
                  idxs=[i for i,line in enumerate(lines) if name in line]
                  print('IDENTITY_LINE_INDEXES',idxs)
                  for idx in idxs:
                      lo=max(0,idx-8); hi=min(len(lines),idx+35)
                      print('--- NEIGHBORHOOD',idx,'---')
                      for j in range(lo,hi): print(f'{j:04d}: {lines[j]}')
              print('\n=== ALL 252 LINES ===')
              for i,line in enumerate(lines):
                  if re.search(r'(?<!\d)0?252\s*期(?!\d)',line):
                      print(f'{i:04d}: {line}')
              b.close()
          PY

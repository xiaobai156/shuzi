name: Export csy rolling source

on:
  push:
    branches:
      - fix/remaining19-csy-rolling-20260910

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining19-csy-rolling-20260910
      - name: Archive source
        run: git archive --format=zip HEAD -o shuzi-csy-rolling-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shuzi-csy-rolling-source
          path: shuzi-csy-rolling-source.zip
          retention-days: 1

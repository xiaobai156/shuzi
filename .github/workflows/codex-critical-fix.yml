name: Apply audited critical fixes

on:
  push:
    branches:
      - codex/fix-critical-audit-20260909

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-critical-audit-20260909
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependency
        run: python -m pip install --upgrade pytest

      - name: Align guarded applicator behavior
        run: |
          sed -i 's/expected_min=2,/expected_min=1,/' .github/scripts/apply_critical_fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_critical_fixes.py')
          text = path.read_text(encoding='utf-8')
          old = 'updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)'
          new = 'updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)'
          if old not in text:
              raise SystemExit('regex replacement helper marker not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply audited fixes
        run: python .github/scripts/apply_critical_fixes.py

      - name: Compile source
        run: python -m compileall -q crawler.py check_duplicates.py kill_numbers run_crawler_prompt.py run_crawler_multi_prompt.py

      - name: Check whitespace
        run: git diff --check

      - name: Run full test suite
        run: python -m pytest -q

      - name: Remove temporary repair automation
        run: |
          rm -f .github/scripts/apply_critical_fixes.py
          rm -f .github/workflows/codex-critical-fix.yml

      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce fail-closed crawl invariants"
          git push origin HEAD:codex/fix-critical-audit-20260909

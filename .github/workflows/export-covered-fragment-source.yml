name: Export covered-fragment source

on:
  push:
    branches:
      - fix/252-covered-fragment-poison-20260909

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/252-covered-fragment-poison-20260909
      - name: Archive source
        run: git archive --format=zip HEAD -o shuzi-current-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shuzi-current-source
          path: shuzi-current-source.zip
          retention-days: 1

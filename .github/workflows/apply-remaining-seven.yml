name: Apply and verify remaining seven fixes

on:
  push:
    branches:
      - fix/remaining-seven-20260909

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/remaining-seven-20260909
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconstruct and apply reviewed patch
        run: |
          cat .github/remaining-seven/fix.part* | tr -d '\r\n' | base64 -d > /tmp/remaining-seven.patch.xz
          echo 'c5bf5a1ca1b98c04005e0e77c7195b2414640d3ecc96f68046bc028838c055df  /tmp/remaining-seven.patch.xz' | sha256sum -c -
          xz -dc /tmp/remaining-seven.patch.xz > /tmp/remaining-seven.patch
          echo '008518b3bdda49fda7d239ce9a8e26053ea3b95b28bfdcc95906da917be78af6  /tmp/remaining-seven.patch' | sha256sum -c -
          git apply --check --binary /tmp/remaining-seven.patch
          git apply --binary /tmp/remaining-seven.patch

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile source
        run: python -m compileall -q crawler.py check_duplicates.py retry_failed.py run_crawler_prompt.py run_crawler_multi_prompt.py kill_numbers tests test_*.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Run full regression suite
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Install real Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run real Chromium isolated tests
        env:
          RUN_BROWSER_SMOKE: '1'
        run: python -m pytest -q tests/test_browser_smoke.py --junitxml=browser-results.xml

      - name: Publish verified repair commit
        run: |
          rm -rf .github/remaining-seven
          rm -f .github/workflows/export-remaining-seven.yml
          rm -f .github/workflows/apply-remaining-seven.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close remaining duplicate and source-contract gaps'
          git push origin HEAD:fix/remaining-seven-20260909
          git archive --format=zip HEAD -o verified-source.zip

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-seven-fix-evidence
          path: |
            pytest-results.xml
            browser-results.xml
            verified-source.zip
          if-no-files-found: warn
          retention-days: 7

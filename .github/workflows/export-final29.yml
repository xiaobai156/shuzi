name: Export final29 source

on:
  push:
    branches:
      - fix/final-29-20260909

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-29-20260909
      - run: git archive --format=zip HEAD -o source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: final29-source
          path: source.zip
          retention-days: 1

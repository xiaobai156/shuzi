name: Verify duplicate BAT correction

on:
  push:
    branches:
      - codex/fix-duplicate-bat-20260909

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-duplicate-bat-20260909
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install --upgrade pytest
      - run: python -m compileall -q crawler.py check_duplicates.py kill_numbers run_crawler_prompt.py run_crawler_multi_prompt.py tests test_*.py
      - run: git diff --check
      - run: python -m pytest -q

      - name: Remove temporary workflow and commit verified state
        run: |
          rm -f .github/workflows/verify-duplicate-bat.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: align duplicate BAT with per-site periods"
          git push origin HEAD:codex/fix-duplicate-bat-20260909

name: Diagnose content class identities

on:
  push:
    branches:
      - diag/252-content-class-20260909

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/252-content-class-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect exact content containers
        run: |
          python - <<'PY'
          import re
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          from kill_numbers.text_utils import html_to_text
          wanted = {'安身立命','六合稳杀十码','六合稳杀七码'}
          targets = [t for t in crawler.load_targets() if t['name'] in wanted]
          for target in targets:
              print('\n===== TARGET', target['name'], '=====')
              try:
                  with target_policy(target, ['252']):
                      _name, docs = crawler.fetch_target_documents(target, ['252'])
              except Exception as exc:
                  print('FETCH_ERROR', type(exc).__name__, exc)
                  continue
              for doc in sorted(docs, key=lambda d:d.priority, reverse=True):
                  class_name = target.get('content_class')
                  if not class_name or class_name not in doc.content:
                      continue
                  tags = list(re.finditer(r'<div\b[^>]*class=["\'][^"\']*\b'+re.escape(class_name)+r'\b[^"\']*["\'][^>]*>', doc.content, re.I))
                  if not tags:
                      continue
                  text = html_to_text(doc.content)
                  print('DOC', doc.kind, doc.priority, doc.url, 'tags=', len(tags), 'chars=', len(doc.content))
                  print('ANCHOR_POS', [m.start() for m in re.finditer(re.escape(target['anchor']), text)])
                  for idx, match in enumerate(tags[:3],1):
                      before = html_to_text(doc.content[:match.start()])
                      print('TAG', idx, 'RAW_POS', match.start(), 'TEXT_BEFORE_LEN', len(before))
                      print('RAW_SNIP', repr(doc.content[max(0,match.start()-500):match.end()+1200]))
                      print('TEXT_BEFORE_TAIL', repr(before[-500:]))
          PY

name: Verify final27 response limits

on:
  push:
    branches:
      - fix/final27-response-limit-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SHUZI_RESULTS_DIR: /tmp/shuzi-results
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final27-response-limit-20260910
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed response-limit patch
        run: |
          base64 -d .github/final27/response-limit.patch.xz.b64 > /tmp/response-limit.patch.xz
          echo 'd15337ac58d0adaf4b8d63279b63590ed43fe0e89e786eeee4af0e4a4cbc7a10  /tmp/response-limit.patch.xz' | sha256sum -c -
          xz -dc /tmp/response-limit.patch.xz > /tmp/response-limit.patch
          echo '756dc94e461f58e56606d813fb5dca353f2a05402a185eeb2a69f661508618aa  /tmp/response-limit.patch' | sha256sum -c -
          git apply --check /tmp/response-limit.patch
          git apply /tmp/response-limit.patch
          git diff --check

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Compile
        run: python -m compileall -q crawler.py check_duplicates.py retry_failed.py run_crawler_multi_prompt.py kill_numbers tests

      - name: Full regression suite
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Install real Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Real Chromium smoke tests
        env:
          RUN_BROWSER_SMOKE: '1'
        run: python -m pytest -q tests/test_browser_smoke.py --junitxml=browser-results.xml

      - name: Live 252 crawl
        shell: bash
        run: |
          mkdir -p "$SHUZI_RESULTS_DIR"
          set +e
          python crawler.py --issues 252 --workers 16 --no-cache-update
          code=$?
          set -e
          echo "CRAWL_EXIT=$code" >> "$GITHUB_ENV"

      - name: Verify repaired targets and summarize
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['SHUZI_RESULTS_DIR'])
          success = root / '252期-杀数字-成功.txt'
          failure = root / '252期-杀数字-失败.txt'
          s = success.read_text(encoding='utf-8-sig', errors='replace') if success.exists() else ''
          f = failure.read_text(encoding='utf-8-sig', errors='replace') if failure.exists() else ''
          required = ['蔡邕救琴', '茂名神码']
          missing = [name for name in required if name not in s]
          still_failed = [name for name in required if name in f]
          sc = sum(1 for x in s.splitlines() if x.strip())
          fc = sum(1 for x in f.splitlines() if x.strip())
          print(f'LIVE252_SUCCESS={sc}')
          print(f'LIVE252_FAILURE={fc}')
          print(f'LIVE252_EXIT={os.environ.get("CRAWL_EXIT")}')
          if missing or still_failed:
              raise SystemExit(f'响应上限修复未通过实时验证：missing={missing}, still_failed={still_failed}')
          PY

      - name: Publish verified repair branch commit
        run: |
          git checkout -- browser-results.xml || true
          rm -f pytest-results.xml
          rm -rf debug_pages
          rm -rf .github/final27
          rm -f .github/workflows/verify-final27-response-limit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: scope larger response limits to verified targets'
          git push origin HEAD:fix/final27-response-limit-20260910

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final27-response-limit-evidence
          path: |
            pytest-results.xml
            browser-results.xml
            /tmp/shuzi-results
          if-no-files-found: warn
          retention-days: 7

name: Diagnose TTSS identity rows

on:
  push:
    branches:
      - diag/ttss-252-depth-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/ttss-252-depth-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read known identity pages
        shell: bash
        run: |
          python - <<'PY'
          import re
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          from kill_numbers.acquisition.strategies.linked_pages import topic_links
          from kill_numbers.acquisition.documents import parseable_documents

          targets = {t['name']: t for t in crawler.load_targets()}
          known = {'告别那时': [3, 12], '私房一肖': [8, 17]}
          for name, pages in known.items():
              t = targets[name]
              print(f'=== {name} ===')
              for page in pages:
                  url = re.sub(r'([?&]page=)\d+', rf'\g<1>{page}', t['url'])
                  with target_policy(t, ['252']):
                      _, docs = crawler.discover_static_documents(url)
                  rows = []
                  for doc in parseable_documents(docs):
                      for href, label in topic_links(doc.content):
                          clean = ' '.join(label.split())
                          if name in clean and ('绝杀10码' in clean or '绝杀十码' in clean):
                              rows.append((href, clean))
                  print(f'PAGE={page} ROWS={len(rows)}')
                  for href, label in rows:
                      print(f'ROW PAGE={page} HREF={href} LABEL={label}')
          PY

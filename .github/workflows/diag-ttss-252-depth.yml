name: Validate TTSS rolling article history

on:
  push:
    branches:
      - diag/ttss-252-depth-20260910

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/ttss-252-depth-20260910
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate stable identity articles still contain 252
        shell: bash
        run: |
          python - <<'PY'
          from urllib.parse import urljoin
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          from kill_numbers.acquisition.documents import parseable_documents

          targets = {t['name']: t for t in crawler.load_targets()}
          stable = {
              '告别那时': ('https://a.ttss.vip/article.aspx?id=975082', ['42','03','30','38','04','09','01','27','41','40']),
              '私房一肖': ('https://a.ttss.vip/article.aspx?id=975015', ['49','30','44','05','14','33','25','34','12','38']),
          }
          for name, (url, expected) in stable.items():
              t = targets[name]
              print(f'=== {name} {url} ===')
              with target_policy(t, ['252']):
                  article_name, docs = crawler.discover_static_documents(url)
              print('ARTICLE_NAME=', article_name)
              print('DOCS=', [(d.kind, d.url, d.priority, d.metadata.get('parseable')) for d in docs])
              article_target = dict(t)
              article_target['special_parser'] = 'identity_article_top_10'
              found, selected = crawler.parse_target_documents(docs, article_target, ['252'])
              print('FOUND=', found)
              print('SELECTED=', None if selected is None else (selected.kind, selected.url))
              if found.get('252') != expected:
                  raise SystemExit(f'{name} 252号码与历史已验证结果不一致: {found.get("252")}')
          PY

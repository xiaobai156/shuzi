name: Diagnose remaining 252 structure

on:
  push:
    branches:
      - diag/252-remaining-structure-20260909

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diag/252-remaining-structure-20260909
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose source documents in parallel
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import crawler
          from kill_numbers.acquisition.policy import target_policy
          from kill_numbers.acquisition.documents import parseable_documents
          from kill_numbers.parsing.source_scope import source_type_family, source_type_allowed, target_for_document
          from kill_numbers.parsing.registry import parse_target_content
          from kill_numbers.parsing.common import find_anchor_positions
          from kill_numbers.text_utils import as_list, html_to_text, normalize_keyword

          names=[
            '平特网心水杀十码','门潭赠庆杀十码','悼心失图','凤舞九天','白虎玄机','当家做主','文武双全','广西三八','宽大为怀','接二连三','雨锁蓝心','来轸方遒','雨过天晴','山水相逢','摇钱树','马经论坛',
            '无庸赘述','天公作美','一点朱砂','此发彼应','易洗鲨鱼','门主立邦','小时了了','百里挑一','聚宝十二','聚宝十','人在江湖','人非土木','片羽吉光',
            '一诺千金','安身立命','六合稳杀十码','六合稳杀七码'
          ]
          targets={t['name']:t for t in crawler.load_targets()}
          nav_terms=['上一篇','下一篇','下一贴','重要通知','绝杀三尾','银海芬姐','珠联璧合（三肖四码）','上一贴','返回列表']
          def inspect(name):
            target=targets[name]
            out={'name':name,'target':target,'documents':[],'fetch_error':'','merged_error':'','merged_parse':None}
            try:
              with target_policy(target,['252']):
                auto,docs=crawler.fetch_target_documents(target,['252'])
              out['auto_name']=auto
            except Exception as exc:
              out['fetch_error']=f'{type(exc).__name__}: {exc}'; return out
            try:
              merged=crawler.parse_target_document_results(docs,target,['252'])
              out['merged_parse']=merged.issue_map
            except Exception as exc:
              out['merged_error']=f'{type(exc).__name__}: {exc}'
            for doc in sorted(parseable_documents(docs),key=lambda x:x.priority,reverse=True):
              text=html_to_text(doc.content); anchors=as_list(target.get('anchor')); stops=as_list(target.get('stop_anchor'))
              row={'kind':doc.kind,'family':source_type_family(doc),'allowed':source_type_allowed(target,doc),'priority':doc.priority,'url':doc.url,'chars':len(doc.content),'metadata':doc.metadata,
                   'issue252_count':len(re.findall(r'(?<!\d)0?252\s*期(?!\d)',text)),
                   'anchor_positions':{a:find_anchor_positions(text,a)[:20] for a in anchors},
                   'stop_positions':{s:find_anchor_positions(text,s)[:20] for s in stops},
                   'nav_counts':{k:normalize_keyword(text).count(normalize_keyword(k)) for k in nav_terms}}
              cls=str(target.get('content_class') or '')
              if cls:
                row['content_class']=cls
                row['class_literal_count']=doc.content.count(cls)
                row['class_tags']=[m.group(0)[:300] for m in re.finditer(r'<[A-Za-z][^>]*class=["\'][^"\']*["\'][^>]*>',doc.content,re.I) if cls in m.group(0)][:8]
              snippets=[]
              for probe in ['252期',*anchors,*stops,*nav_terms]:
                pos=text.find(probe)
                if pos>=0:
                  snippets.append({'probe':probe,'text':' '.join(text[max(0,pos-300):pos+900].split())})
              row['snippets']=snippets[:15]
              try:
                row['parse']=parse_target_content(doc.content,target_for_document(target,doc),['252'])
              except Exception as exc:
                row['parse_error']=f'{type(exc).__name__}: {exc}'
              out['documents'].append(row)
            return out
          result=[]
          with ThreadPoolExecutor(max_workers=8) as pool:
            futures={pool.submit(inspect,n):n for n in names}
            for f in as_completed(futures):
              item=f.result(); result.append(item)
              print(item['name'],'fetch=',item['fetch_error'],'merged=',item['merged_parse'],item['merged_error'])
          result.sort(key=lambda x:names.index(x['name']))
          Path('/tmp/diag252.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: diag-252-remaining-structure-fast
          path: /tmp/diag252.json
          retention-days: 2

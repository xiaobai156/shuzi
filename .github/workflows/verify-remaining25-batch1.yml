name: Verify remaining25 batch1

on:
  push:
    branches:
      - fix/remaining25-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      SHUZI_RESULTS_DIR: /tmp/shuzi-results
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining25-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply reviewed patch
        run: |
          base64 -d .github/remaining25/batch1.patch.xz.b64 > /tmp/batch1.patch.xz
          echo 'ad2a6e88b97d1db90d1cf91e6eb17db04baccdd7fb8d777c0fceaab1a23ec8fe  /tmp/batch1.patch.xz' | sha256sum -c -
          xz -dc /tmp/batch1.patch.xz > /tmp/batch1.patch
          echo 'aec2f51fdc44449765da9b4ba8326c245d0649ce6bc765cdb4fe01c880b06b22  /tmp/batch1.patch' | sha256sum -c -
          git apply --check /tmp/batch1.patch
          git apply /tmp/batch1.patch
          git diff --check
      - name: Test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Full regression suite
        run: python -m pytest -q --junitxml=pytest-results.xml
      - name: Real Chromium smoke
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          RUN_BROWSER_SMOKE=1 python -m pytest -q tests/test_browser_smoke.py --junitxml=browser-results.xml
      - name: Live 252 crawl
        shell: bash
        run: |
          mkdir -p "$SHUZI_RESULTS_DIR"
          set +e
          python crawler.py --issues 252 --workers 16 --no-cache-update
          code=$?
          set -e
          echo "CRAWL_EXIT=$code" >> "$GITHUB_ENV"
      - name: Verify exact repaired results
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['SHUZI_RESULTS_DIR'])
          success=root/'252期-杀数字-成功.txt'
          failure=root/'252期-杀数字-失败.txt'
          s=success.read_text(encoding='utf-8-sig',errors='replace') if success.exists() else ''
          f=failure.read_text(encoding='utf-8-sig',errors='replace') if failure.exists() else ''
          expected={
            '湖心小筑':'21,44,34,29,24,14,43,10,20,03',
            '六合绝杀十码':'24,37,32,40,47,22,43,13,11,29',
            '新竹论坛':'17,31,36,48,05,30,45,42,24,39',
            '醉八仙':'02,03,11,14,15,23,26,27,38,47',
          }
          lines=[line.strip() for line in s.splitlines() if line.strip()]
          missing=[]
          mismatch=[]
          for name,numbers in expected.items():
              matches=[line for line in lines if line.endswith(' '+name)]
              if len(matches)!=1:
                  missing.append((name,len(matches)))
              elif matches[0] != f'{numbers} {name}':
                  mismatch.append((name,matches[0],numbers))
              if name in f:
                  mismatch.append((name,'still in failure file',''))
          sc=len(lines)
          fc=sum(1 for line in f.splitlines() if line.strip())
          print(f'LIVE252_SUCCESS={sc}')
          print(f'LIVE252_FAILURE={fc}')
          print(f'LIVE252_EXIT={os.environ.get("CRAWL_EXIT")}')
          if missing or mismatch:
              raise SystemExit(f'batch1 live verification failed: missing={missing} mismatch={mismatch}')
          PY
      - name: Publish verified branch commit
        run: |
          git checkout -- browser-results.xml || true
          rm -f pytest-results.xml browser-results.xml
          rm -rf debug_pages .github/remaining25
          rm -f .github/workflows/export-remaining25-source.yml
          rm -f .github/workflows/verify-remaining25-batch1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: ignore identity-only decoded fragments'
          git push origin HEAD:fix/remaining25-20260910
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining25-batch1-evidence
          path: |
            pytest-results.xml
            browser-results.xml
            /tmp/shuzi-results
          if-no-files-found: warn
          retention-days: 7

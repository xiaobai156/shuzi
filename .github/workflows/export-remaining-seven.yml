name: Export remaining-seven source

on:
  push:
    branches:
      - fix/remaining-seven-20260909

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/remaining-seven-20260909
      - name: Archive source
        run: git archive --format=zip HEAD -o shuzi-remaining-seven-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: shuzi-remaining-seven-source
          path: shuzi-remaining-seven-source.zip
          retention-days: 1

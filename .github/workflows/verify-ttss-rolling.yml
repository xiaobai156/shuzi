name: Verify TTSS rolling identity articles

on:
  push:
    branches:
      - fix/ttss-rolling-identity-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      SHUZI_RESULTS_DIR: /tmp/shuzi-results
      SHUZI_BROWSER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ttss-rolling-identity-20260910
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply reviewed TTSS patch
        run: |
          base64 -d .github/ttss/rolling.patch.xz.b64 > /tmp/ttss.patch.xz
          echo '7391589ddcb831d1bb6193ff120d2590fe2257be378b6a65b7794f84f96b7e07  /tmp/ttss.patch.xz' | sha256sum -c -
          xz -dc /tmp/ttss.patch.xz > /tmp/ttss.patch
          echo '645fd5ad53b3c637bb6b0e322036210473b413f0fb3f789fecae50c55773fc8c  /tmp/ttss.patch' | sha256sum -c -
          git apply --check /tmp/ttss.patch
          git apply /tmp/ttss.patch
          git diff --check

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q crawler.py check_duplicates.py retry_failed.py run_crawler_multi_prompt.py kill_numbers tests
      - name: Full regression suite
        run: python -m pytest -q --junitxml=pytest-results.xml

      - name: Install real Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real Chromium smoke tests
        env:
          RUN_BROWSER_SMOKE: '1'
        run: python -m pytest -q tests/test_browser_smoke.py --junitxml=browser-results.xml

      - name: Live 252 crawl
        shell: bash
        run: |
          mkdir -p "$SHUZI_RESULTS_DIR"
          set +e
          python crawler.py --issues 252 --workers 16 --no-cache-update
          code=$?
          set -e
          echo "CRAWL_EXIT=$code" >> "$GITHUB_ENV"

      - name: Verify TTSS 252 results
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['SHUZI_RESULTS_DIR'])
          success = root / '252期-杀数字-成功.txt'
          failure = root / '252期-杀数字-失败.txt'
          s = success.read_text(encoding='utf-8-sig', errors='replace') if success.exists() else ''
          f = failure.read_text(encoding='utf-8-sig', errors='replace') if failure.exists() else ''
          expected = {
              '告别那时': '42,03,30,38,04,09,01,27,41,40',
              '私房一肖': '49,30,44,05,14,33,25,34,12,38',
          }
          lines = [line.strip() for line in s.splitlines() if line.strip()]
          for name, numbers in expected.items():
              matches = [line for line in lines if line.endswith(' ' + name)]
              if matches != [numbers + ' ' + name]:
                  raise SystemExit(f'{name} 252实时结果不匹配: {matches}')
              if name in f:
                  raise SystemExit(f'{name} 同时出现在失败文件')
          print('LIVE252_SUCCESS=' + str(len(lines)))
          print('LIVE252_FAILURE=' + str(sum(1 for line in f.splitlines() if line.strip())))
          print('TTSS_252_VERIFIED=告别那时,私房一肖')
          PY

      - name: Publish verified branch commit
        run: |
          git checkout -- browser-results.xml || true
          rm -f pytest-results.xml
          rm -rf debug_pages .github/ttss
          rm -f .github/workflows/verify-ttss-rolling.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve TTSS periods inside rolling identity articles'
          git push origin HEAD:fix/ttss-rolling-identity-20260910

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttss-rolling-evidence
          path: |
            pytest-results.xml
            browser-results.xml
            /tmp/shuzi-results
          if-no-files-found: warn
          retention-days: 7
